name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          targets="tests"
          for path in sequential_analysis_time_series.py draft_Sequential-Analysis-with-Time-Series-Methods-7c15b76576a7.py; do
            [ -f "$path" ] && targets="$targets $path"
          done
          ruff check --select E9,F821 --exclude "._*" $targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest -q
